name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install ".[test]"
      - name: Tests
        run: pytest -v
      - name: Command-line smoke test
        run: |
          saxs-icp --version
          saxs-icp align examples/SASDXB2_model.pdb examples/SASDXB2_envelope.cif -o smoke
          python -m saxs_icp --help
